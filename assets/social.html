<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; background: linear-gradient(135deg, #1a1612, #2a1d10); color: #fff; font-family: "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 700; }
  .top img { width: 84px; height: 84px; }
  h1 { font-size: 64px; line-height: 1.08; margin: 0; letter-spacing: -.02em; }
  h1 code { font-family: "Cascadia Mono", Consolas, monospace; color: #f5a64a; font-size: .86em; }
  .term { font: 26px/1.5 "Cascadia Mono", Consolas, monospace; background: #0f0d0b; border: 1px solid #3a2f24; border-radius: 14px; padding: 18px 24px; color: #e8e2da; }
  .bad { color: #ff8a7a; text-decoration: line-through; } .ok { color: #8fd18b; } .dim { color: #8a8278; }
  .foot { font-size: 24px; color: #d9cfc2; }
</style></head>
<body><div class="card">
  <div class="top"><img src="icon.svg" alt="">ZoneZap</div>
  <h1>No more <code>:Zone.Identifier</code><br>files in WSL</h1>
  <div class="term">report.pdf &nbsp;<span class="bad">report.pdf:Zone.Identifier</span> <span class="ok">&nbsp;removed in ~1 ms</span></div>
  <div class="foot">One-line install · ~100 KB static binary · zone info kept as an xattr · open source (MIT)</div>
</div></body></html>
