name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) v="0.0.0-ci.${GITHUB_SHA::7}" ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Unit tests and static build (Alpine, musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -c \
            "apk add -q build-base linux-headers && make test OUT=/tmp/t && make VERSION=$VERSION OUT=dist && chown -R $(id -u):$(id -g) dist"
          file dist/zonezap
          dist/zonezap --version

      - name: Self-test on the runner (real fanotify, no Windows side)
        run: sudo dist/zonezap self-test

      - name: Package
        run: |
          mv dist/zonezap "dist/zonezap-linux-${{ matrix.arch }}"
          cd dist
          # LF line ending so `sha256sum -c` works everywhere.
          sha256sum "zonezap-linux-${{ matrix.arch }}" > "zonezap-linux-${{ matrix.arch }}.sha256"
          cat "zonezap-linux-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: zonezap-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ZoneZap $GITHUB_REF_NAME" --notes-file .github/release-notes.md
